# discord and music on second monitor tag 1
window_rule=tags:3,monitor:eDP-1,app_id:discord,is_open_silent:1
window_rule=tags:3,monitor:eDP-1,app_id:youtube-music,is_open_silent:1

# steam on primary monitor tag 2
window_rule=tags:2,monitor:eDP-1,app_id:steam,is_open_silent:1
# steam friends list floating
window_rule=is_floating:1,title:Friends List

# firefox pip floating
window_rule=is_floating:1,is_overlay:1,no_border:1,title:Picture-in-Picture

# all fullscreen applications on monitor 1 have vrr enabled on fullscreen
window_rule=title: ,vrr_only_fullscreen:1
